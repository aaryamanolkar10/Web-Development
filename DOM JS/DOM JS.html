<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
</head>

<body>

    <h1 id="demo">Hello</h1>

    <button onclick="changeText()">
        Click Me
    </button>

    <script>
        function changeText() {
            document.getElementById("demo").innerHTML =
                "Welcome to JavaScript DOM";
        }
    </script>

</body>
</html>
