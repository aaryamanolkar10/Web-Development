<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Sentence Maker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6C63FF,#42A5F5);
}

.container{
    width:700px;
    max-width:90%;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
    color:#333;
}

#story{
    margin:30px 0;
    font-size:22px;
    line-height:1.7;
    color:#444;
    min-height:120px;
}

button{
    background:#6C63FF;
    color:white;
    border:none;
    padding:14px 30px;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#5348e2;
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">

<h1>🎲 Random Story Generator</h1>

<div id="story">
Click the button to generate a random story.
</div>

<button onclick="generateStory()">
Generate Story
</button>

</div>

<script>

const adjectives = [
"brave",
"tiny",
"gigantic",
"sleepy",
"crazy",
"angry",
"happy",
"mysterious"
];

const characters = [
"dragon",
"pirate",
"robot",
"wizard",
"alien",
"ninja",
"penguin",
"astronaut"
];

const verbs = [
"ate",
"launched",
"destroyed",
"painted",
"hugged",
"stole",
"found",
"built"
];

const objects = [
"pizza",
"spaceship",
"castle",
"banana",
"treasure",
"computer",
"football",
"ice cream"
];

const places = [
"on Mars",
"in Pune",
"inside a volcano",
"under the sea",
"in Hogwarts",
"at the beach",
"in the jungle",
"inside a video game"
];

const endings = [
"Everyone applauded.",
"The internet exploded.",
"It became a legend.",
"Nobody believed the story.",
"It was all a dream.",
"The world was never the same.",
"They lived happily ever after.",
"Scientists are still confused."
];

function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function generateStory(){

const story =
`Once upon a time, a <b>${random(adjectives)}</b> 
<b>${random(characters)}</b> 
<b>${random(verbs)}</b> a 
<b>${random(objects)}</b> 
${random(places)}.
${random(endings)}`;

document.getElementById("story").innerHTML=story;

}

generateStory();

</script>

</body>
</html>
